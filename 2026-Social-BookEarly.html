    <script>
        function includeHTML() {
            var z, i, elmnt, file, xhttp;
            z = document.getElementsByTagName("*");
            for (i = 0; i < z.length; i++) {
                elmnt = z[i];
                file = elmnt.getAttribute("w3-include-html");
                if (file) {
                    xhttp = new XMLHttpRequest();
                    xhttp.onreadystatechange = function() {
                        if (this.readyState == 4) {
                            if (this.status == 200) {elmnt.innerHTML = this.responseText;}
                            if (this.status == 404) {elmnt.innerHTML = "Page not found.";}
                            elmnt.removeAttribute("w3-include-html");
                            includeHTML();
                        }
                    }
                    xhttp.open("GET", file, true);
                    xhttp.send();
                    return;
                }
            }
        }
        document.addEventListener("DOMContentLoaded", includeHTML);
    </script>

<div id="assetModal" class="modal" onclick="closeModal()">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="imgFullSize" style="display: none;">
    
    <video class="modal-content" id="videoFullSize" controls autoplay playsinline style="display: none;">
        <source id="videoSource" src="" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>

    <script>
        const modal = document.getElementById("assetModal");
        const modalImg = document.getElementById("imgFullSize");

function openModal(url) {
    const modal = document.getElementById("assetModal");
    const imgElement = document.getElementById("imgFullSize");
    const videoElement = document.getElementById("videoFullSize");
    const videoSource = document.getElementById("videoSource");

    modal.style.display = "flex";

    // Check if the URL is a video
    if (url.toLowerCase().includes('.mp4')) {
        imgElement.style.display = "none";
        videoElement.style.display = "block";
        
        // Load and play video
        videoSource.src = url;
        videoElement.load(); // Forces the browser to start looking at the file immediately
        videoElement.play();
    } else {
        // Handle as image
        videoElement.style.display = "none";
        imgElement.style.display = "block";
        imgElement.src = url;
    }
}

function closeModal() {
    const modal = document.getElementById("assetModal");
    const videoElement = document.getElementById("videoFullSize");
    
    modal.style.display = "none";
    
    // Crucial: Stop the video and clear source so it doesn't keep loading in the background
    videoElement.pause();
    document.getElementById("videoSource").src = "";
    videoElement.load();
}

        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") closeModal();
        });
    </script>
